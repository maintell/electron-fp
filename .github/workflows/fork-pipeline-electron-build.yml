name: Fork Pipeline - Electron Build (fork-friendly)

# 复刻上游 pipeline-segment-electron-build.yml，但移除对 /mnt/cross-instance-cache + Azure SAS + AKS 的强依赖。
# 上游在 checkout 阶段把完整 src 缓存到共享盘，build 阶段再恢复；fork 若无 ARC 大盘/私有存储，此恢复会 exit 1。
# 本版本：恢复步骤改为 continue-on-error，缺失时回退到完整 gclient sync（慢但可用）。
# 其余逻辑与上游保持一致，便于后续 `e sync --3` 等流程同步。

on:
  workflow_call:
    inputs:
      target-platform:
        type: string
        required: true
      target-arch:
        type: string
        required: true
      target-variant:
        type: string
        default: all
      build-runs-on:
        type: string
        required: true
      build-container:
        type: string
        required: false
        default: '{"image":null}'
      is-release:
        type: boolean
        default: false
        required: true
      gn-build-type:
        type: string
        default: testing
        required: true
      generate-symbols:
        type: boolean
        default: false
        required: true
      generate-chromedriver:
        type: boolean
        default: true
      generate-test-artifacts:
        type: boolean
        default: true
      upload-to-storage:
        type: string
        default: '0'
        required: true
      is-asan:
        type: boolean
        default: false
      upload-out-gen-artifacts:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      enable-ssh:
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fork-build-${{ inputs.target-platform }}-${{ inputs.target-arch }}-${{ inputs.target-variant }}-${{ inputs.is-asan }}-${{ inputs.is-release }}-${{ github.ref_protected == true && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_protected != true }}

env:
  CHROMIUM_GIT_COOKIE: ${{ secrets.CHROMIUM_GIT_COOKIE }}
  CHROMIUM_GIT_COOKIE_WINDOWS_STRING: ${{ secrets.CHROMIUM_GIT_COOKIE_WINDOWS_STRING }}
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  ELECTRON_RBE_JWT: ${{ secrets.ELECTRON_RBE_JWT }}
  GCLIENT_EXTRA_ARGS: ${{ inputs.target-platform == 'macos' && '--custom-var=checkout_mac=True --custom-var=host_os=mac' || inputs.target-platform == 'win' && '--custom-var=checkout_win=True' || '--custom-var=checkout_arm64=True' }}
  ELECTRON_OUT_DIR: Default
  ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
  RUNNER_LABEL: ${{ inputs.build-runs-on }}

jobs:
  build:
    defaults:
      run:
        shell: bash
    runs-on: ${{ inputs.build-runs-on }}
    permissions:
      contents: read
    container: ${{ fromJSON(inputs.build-container) }}
    env:
      TARGET_ARCH: ${{ inputs.target-arch }}
      TARGET_PLATFORM: ${{ inputs.target-platform }}
    steps:
      - name: Create src dir
        run: mkdir -p src

      - name: Checkout Electron
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src/electron
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup SSH Debugging
        if: ${{ inputs.target-platform == 'macos' && (inputs.enable-ssh || env.ACTIONS_STEP_DEBUG == 'true') }}
        uses: ./src/electron/.github/actions/ssh-debug
        with:
          tunnel: 'true'
        env:
          CLOUDFLARE_TUNNEL_CERT: ${{ secrets.CLOUDFLARE_TUNNEL_CERT }}
          CLOUDFLARE_TUNNEL_HOSTNAME: ${{ vars.CLOUDFLARE_TUNNEL_HOSTNAME }}
          CLOUDFLARE_USER_CA_CERT: ${{ secrets.CLOUDFLARE_USER_CA_CERT }}
          AUTHORIZED_USERS: ${{ secrets.SSH_DEBUG_AUTHORIZED_USERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up space (macOS)
        if: ${{ inputs.target-platform == 'macos' }}
        uses: ./src/electron/.github/actions/free-space-macos
        background: true

      - name: Setup Node.js/npm (macOS)
        if: ${{ inputs.target-platform == 'macos' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.21.x
          cache: yarn
          cache-dependency-path: src/electron/yarn.lock

      - name: Install Dependencies
        uses: ./src/electron/.github/actions/install-dependencies

      - name: Set GN_EXTRA_ARGS for Linux
        if: ${{ inputs.target-platform == 'linux' }}
        run: |
          if [ "${{ inputs.target-arch }}" = "arm64" ]; then
            GN_EXTRA_ARGS='target_cpu="arm64" fatal_linker_warnings=false enable_linux_installer=false'
          elif [ "${{ inputs.is-asan }}" = true ]; then
            GN_EXTRA_ARGS='is_asan=true is_lsan=true v8_enable_verify_heap=true'
          fi
          echo "GN_EXTRA_ARGS=$GN_EXTRA_ARGS" >> $GITHUB_ENV

      - name: Set Chromium Git Cookie
        uses: ./src/electron/.github/actions/set-chromium-cookie

      - name: Install Build Tools
        uses: ./src/electron/.github/actions/install-build-tools

      - name: Generate DEPS Hash
        run: |
          node src/electron/script/generate-deps-hash.js
          DEPSHASH=v2-src-cache-$(cat src/electron/.depshash)
          echo "DEPSHASH=$DEPSHASH" >> $GITHUB_ENV
          echo "CACHE_PATH=$DEPSHASH.tar" >> $GITHUB_ENV

      - name: Wait for space cleanup to finish
        wait-all:

      - name: Check disk space after freeing up space
        if: ${{ inputs.target-platform == 'macos' }}
        run: df -h

      - name: Install AZCopy
        if: ${{ inputs.target-platform == 'macos' }}
        run: brew install azcopy || true

      # --- Fork fork-friendly cache: try upstream cache, fallback to full sync ---
      - name: 'Restore src cache via AZCopy (fork: optional)'
        if: ${{ inputs.target-platform != 'linux' }}
        continue-on-error: true
        uses: ./src/electron/.github/actions/restore-cache-azcopy
        with:
          target-platform: ${{ inputs.target-platform }}

      - name: 'Restore src cache via AKS (fork: optional)'
        if: ${{ inputs.target-platform == 'linux' }}
        continue-on-error: true
        uses: ./src/electron/.github/actions/restore-cache-aks

      - name: Checkout Electron (again after cache restore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src/electron
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fallback - full gclient sync if cache miss (fork)
        run: |
          set -euo pipefail
          if [ -d "src/third_party/blink" ] && [ -f "src/third_party/blink/README.chromium" ]; then
            echo "Cache hit: src/third_party/blink exists, skipping full sync"
            exit 0
          fi
          echo "::warning::Cache miss - src/third_party/blink not found, running full gclient sync (30-60min, ~30GB download)"
          echo "GIT_CACHE_PATH=$(pwd)/git-cache" >> $GITHUB_ENV
          # 配置 gclient 指向本 fork
          e d gclient config \
            --name "src/electron" \
            --unmanaged \
            ${GCLIENT_EXTRA_ARGS} \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" || {
              echo "e d gclient config failed, trying plain gclient"
              gclient config --name "src/electron" --unmanaged ${GCLIENT_EXTRA_ARGS} "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            }
          if [ -n "${TARGET_OS:-}" ]; then
            echo "target_os=['$TARGET_OS']" >> ./.gclient
          fi
          # 无缓存时完整同步
          if command -v e >/dev/null 2>&1; then
            ELECTRON_DEPOT_TOOLS_WIN_TOOLCHAIN=0 DEPOT_TOOLS_WIN_TOOLCHAIN=0 e d gclient sync --with_branch_heads --with_tags --nohooks || e d gclient sync --with_branch_heads --with_tags
          else
            gclient sync --with_branch_heads --with_tags --nohooks || gclient sync --with_branch_heads --with_tags
          fi

      - name: Fix Sync
        if: ${{ inputs.target-platform != 'linux' }}
        continue-on-error: true
        uses: ./src/electron/.github/actions/fix-sync
        with:
          target-platform: ${{ inputs.target-platform }}
        env:
          ELECTRON_DEPOT_TOOLS_DISABLE_LOG: true

      - name: Init Build Tools
        run: |
          e init -f --root=$(pwd) --out=Default ${{ inputs.gn-build-type }} --import ${{ inputs.gn-build-type }} --target-cpu ${{ inputs.target-arch }} --remote-build siso

      - name: Run Electron Only Hooks
        run: |
          e d gclient runhooks --spec="solutions=[{'name':'src/electron','url':None,'deps_file':'DEPS','custom_vars':{'process_deps':False},'managed':False}]"

      - name: Download PGO Profiles
        if: ${{ inputs.gn-build-type == 'release' }}
        env:
          PGO_TARGET: ${{ inputs.target-platform }}-${{ inputs.target-arch }}
        run: |
          python3 src/electron/script/pgo/download-profiles.py --targets "$PGO_TARGET,v8-builtins" || echo "::warning::PGO download failed, continuing"

      - name: Regenerate DEPS Hash
        run: |
          (cd src/electron && git checkout . || true) && node src/electron/script/generate-deps-hash.js
          echo "DEPSHASH=$(cat src/electron/.depshash)" >> $GITHUB_ENV

      - name: Free up space (macOS second pass)
        if: ${{ inputs.target-platform == 'macos' }}
        uses: ./src/electron/.github/actions/free-space-macos

      - name: Download custom siso binary (Windows)
        if: ${{ inputs.target-platform == 'win' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: siso-windows-amd64
          path: ${{ runner.temp }}/siso

      - name: Download custom siso binary (Linux)
        if: ${{ inputs.target-platform == 'linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: siso-linux-amd64
          path: ${{ runner.temp }}/siso

      - name: Download custom siso binary (macOS)
        if: ${{ inputs.target-platform == 'macos' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: siso-darwin-arm64
          path: ${{ runner.temp }}/siso

      - name: Set SISO_PATH (Windows)
        if: ${{ inputs.target-platform == 'win' }}
        run: |
          SISO_BIN="${RUNNER_TEMP}/siso/siso.exe"
          if [ ! -f "$SISO_BIN" ]; then
            echo "error: expected siso binary at $SISO_BIN - siso build may have been skipped" >&2
            echo "Trying to continue without SISO_PATH (will use ninja fallback)"
            exit 0
          fi
          echo "SISO_PATH=$SISO_BIN" >> "$GITHUB_ENV"
          echo "Using custom siso binary at $SISO_BIN"

      - name: Set SISO_PATH (Linux)
        if: ${{ inputs.target-platform == 'linux' }}
        run: |
          SISO_BIN="${RUNNER_TEMP}/siso/siso"
          if [ ! -f "$SISO_BIN" ]; then
            echo "error: expected siso binary at $SISO_BIN - siso build may have been skipped" >&2
            exit 0
          fi
          chmod +x "$SISO_BIN" || true
          echo "SISO_PATH=$SISO_BIN" >> "$GITHUB_ENV"
          echo "Using custom siso binary at $SISO_BIN"

      - name: Set SISO_PATH (macOS)
        if: ${{ inputs.target-platform == 'macos' }}
        run: |
          SISO_BIN="${RUNNER_TEMP}/siso/siso"
          if [ ! -f "$SISO_BIN" ]; then
            echo "error: expected siso binary at $SISO_BIN" >&2
            exit 0
          fi
          chmod +x "$SISO_BIN" || true
          xattr -d com.apple.quarantine "$SISO_BIN" || true
          codesign -s - "$SISO_BIN" || true
          echo "SISO_PATH=$SISO_BIN" >> "$GITHUB_ENV"
          echo "Using custom siso binary at $SISO_BIN"

      - name: Build Electron
        if: ${{ inputs.target-platform != 'macos' || (inputs.target-variant == 'all' || inputs.target-variant == 'darwin') }}
        uses: ./src/electron/.github/actions/build-electron
        with:
          target-arch: ${{ inputs.target-arch }}
          target-platform: ${{ inputs.target-platform }}
          artifact-platform: ${{ inputs.target-platform == 'macos' && 'darwin' || inputs.target-platform }}
          is-release: '${{ inputs.is-release }}'
          generate-symbols: '${{ inputs.generate-symbols }}'
          generate-chromedriver: '${{ inputs.generate-chromedriver }}'
          generate-test-artifacts: '${{ inputs.generate-test-artifacts }}'
          upload-to-storage: '${{ inputs.upload-to-storage }}'
          is-asan: '${{ inputs.is-asan }}'
          upload-out-gen-artifacts: '${{ inputs.upload-out-gen-artifacts }}'
          publish: '${{ inputs.publish }}'

      - name: Set GN_EXTRA_ARGS for MAS Build
        if: ${{ inputs.target-platform == 'macos' && (inputs.target-variant == 'all' || inputs.target-variant == 'mas') }}
        run: |
          echo "MAS_BUILD=true" >> $GITHUB_ENV
          GN_EXTRA_ARGS='is_mas_build=true'
          echo "GN_EXTRA_ARGS=$GN_EXTRA_ARGS" >> $GITHUB_ENV

      - name: Build Electron (MAS)
        if: ${{ inputs.target-platform == 'macos' && (inputs.target-variant == 'all' || inputs.target-variant == 'mas') }}
        uses: ./src/electron/.github/actions/build-electron
        with:
          target-arch: ${{ inputs.target-arch }}
          target-platform: ${{ inputs.target-platform }}
          artifact-platform: 'mas'
          is-release: '${{ inputs.is-release }}'
          generate-symbols: '${{ inputs.generate-symbols }}'
          generate-chromedriver: '${{ inputs.generate-chromedriver }}'
          generate-test-artifacts: '${{ inputs.generate-test-artifacts }}'
          upload-to-storage: '${{ inputs.upload-to-storage }}'
          step-suffix: '(mas)'
          publish: '${{ inputs.publish }}'
