name: Fingerprint Check

# Fast static gate for fingerprint/ changes (<1min, no container).
# Triggers only on fingerprint/** to keep PR feedback tight;
# fork-release.yml's fingerprint-patch job covers release tags separately.

on:
  pull_request:
    paths:
      - 'fingerprint/**'
      - '.github/workflows/fingerprint-check.yml'
  push:
    branches:
      - main
    paths:
      - 'fingerprint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint-check:
    name: fingerprint static check (<1min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Static fingerprint patch check (56 keys, isolation, hunks)
        run: python3 fingerprint/scripts/check.py

      # NOTE: the dry-run below verifies NOTHING on a runner without a Chromium
      # checkout - apply.py needs src/third_party/blink (~100GB, 30-60min gclient
      # sync) to test whether hunks actually apply. --allow-missing-src makes the
      # skip loud and deliberate rather than a silent false pass. Real apply
      # coverage lives in fork-release.yml's fingerprint-patch job, which runs
      # against a real checkout.
      - name: "Fingerprint patch dry-run (no checkout - explicit no-op)"
        run: python3 fingerprint/scripts/apply.py --dry-run --allow-missing-src
