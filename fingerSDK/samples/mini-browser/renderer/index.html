<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sdk-mini-browser</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #bar { display: flex; gap: 8px; padding: 12px; height: 36px; background: #1e1e1e; }
  #url { flex: 1; background: #2d2d2d; color: #eee; border: 1px solid #444; padding: 4px 8px; }
  button { background: #0e639c; color: #fff; border: 0; padding: 4px 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="bar">
  <input id="url" value="https://example.com/">
  <button id="go">Go</button>
</div>
<script>
  const input = document.getElementById('url');
  const go = () => window.mini.navigate(input.value);
  document.getElementById('go').addEventListener('click', go);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
